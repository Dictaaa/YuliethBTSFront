name: Actualizar BTS
on:
  schedule:
    - cron: '15 12 * * *'   # 7:15 a. m. hora de Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/bts-updater/index.js
      - name: Guardar cambios
        run: |
          git config user.name "Dictaaa"
          git config user.email "105684149+Dictaaa@users.noreply.github.com"
          git add src/assets/data/bts
          git diff --staged --quiet || (git commit -m "Actualizar datos BTS" && git push)